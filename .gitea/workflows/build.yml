name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone "https://x-access-token:${{ github.token }}@gitea.lan.whoisjason.me/jason/bgp.git" .

      - uses: docker/login-action@v3
        with:
          registry: gitea.lan.whoisjason.me
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: gitea.lan.whoisjason.me/jason/bgp:latest

      - name: Redeploy on Portainer
        run: |
          STACK_ID=$(curl -sk \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}" \
            "${{ secrets.PORTAINER_URL }}/api/stacks" | \
            python3 -c "import sys,json; stacks=json.load(sys.stdin); print(next(s['Id'] for s in stacks if s['Name']=='bgp' and s['EndpointId']==15))")
          python3 -c "import json; print(json.dumps({'stackFileContent': 'services:\n  bgp-looking-glass:\n    container_name: bgp-looking-glass\n    image: gitea.lan.whoisjason.me/jason/bgp:latest\n    restart: unless-stopped\n    ports:\n      - \"3090:3000\"\n', 'pullImage': True, 'prune': True}))" \
            > /tmp/portainer-body.json
          curl -skf -X PUT \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/portainer-body.json \
            "${{ secrets.PORTAINER_URL }}/api/stacks/${STACK_ID}?endpointId=15"
